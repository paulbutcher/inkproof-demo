theorem Inkproof.Demo.Place.place_getElem?_of_uncovered : ∀ (rate day : Nat) (rs : Array Inkproof.Demo.MiniSeed.Record) (j : Nat), (∀ (r : Inkproof.Demo.MiniSeed.Record), r ∈ rs → ¬Inkproof.Demo.Place.covers rate day r j) → (Inkproof.Demo.Place.place rate day rs)[j]? = (Array.replicate (86400 * rate) Option.none)[j]?
