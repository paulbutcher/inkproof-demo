def Inkproof.Demo.Stack.drawn : Inkproof.Core.Pyramid Inkproof.Demo.Seismic.Extent → Nat → Nat → Nat → Inkproof.Core.Segmented Nat (Int × Int)
theorem Inkproof.Demo.Stack.drawn_points_perm : ∀ (p : Inkproof.Core.Pyramid Inkproof.Demo.Seismic.Extent) (lo hi cols : Nat), (Inkproof.Demo.Stack.drawn p lo hi cols).series.points.toList.Perm (Inkproof.Demo.Stack.present p lo hi cols).toList
theorem Inkproof.Demo.Stack.getElem_columns : ∀ (p : Inkproof.Core.Pyramid Inkproof.Demo.Seismic.Extent) (lo hi cols c : Nat) (h : c < (Inkproof.Demo.Stack.columns p lo hi cols).size), (Inkproof.Demo.Stack.columns p lo hi cols)[c] = p.query (lo + (hi - lo) * c / cols) (lo + (hi - lo) * (c + 1) / cols)
theorem Inkproof.Demo.Stack.getElem_traces : ∀ (p : Inkproof.Core.Pyramid Inkproof.Demo.Seismic.Extent) (lo hi cols height top i : Nat) (h : i < (Inkproof.Demo.Stack.traces p lo hi cols height top).length), (Inkproof.Demo.Stack.traces p lo hi cols height top)[i] = Inkproof.Demo.Stack.outline height top (List.filterMap (fun x => match x with | (x, v) => Option.map (fun x_1 => (x_1, x)) v) (Inkproof.Demo.Stack.drawn p lo hi cols).segments.toList[i].points.toList)
theorem Inkproof.Demo.Stack.length_outlinePoints : ∀ (height top : Nat) (run : List ((Int × Int) × Nat)), (Inkproof.Demo.Stack.outlinePoints height top run).length = 2 * run.length
theorem Inkproof.Demo.Stack.length_traces : ∀ (p : Inkproof.Core.Pyramid Inkproof.Demo.Seismic.Extent) (lo hi cols height top : Nat), (Inkproof.Demo.Stack.traces p lo hi cols height top).length = (Inkproof.Demo.Stack.drawn p lo hi cols).numSegments
theorem Inkproof.Demo.Stack.mem_breaks_drawn : ∀ (p : Inkproof.Core.Pyramid Inkproof.Demo.Seismic.Extent) (lo hi cols b : Nat), b ∈ (Inkproof.Demo.Stack.drawn p lo hi cols).breaks ↔ ∃ h, (Inkproof.Core.Series.ofUnsorted (Inkproof.Demo.Stack.present p lo hi cols)).xs[b - 1] + 1 < (Inkproof.Core.Series.ofUnsorted (Inkproof.Demo.Stack.present p lo hi cols)).xs[b]
theorem Inkproof.Demo.Stack.mem_outlinePoints : ∀ (height top : Nat) (run : List ((Int × Int) × Nat)) (q : Nat × Int), q ∈ Inkproof.Demo.Stack.outlinePoints height top run ↔ ∃ a b x, ((a, b), x) ∈ run ∧ (q = (x, Inkproof.Demo.Stack.pixelY height top b) ∨ q = (x, Inkproof.Demo.Stack.pixelY height top a))
theorem Inkproof.Demo.Stack.mem_present : ∀ (p : Inkproof.Core.Pyramid Inkproof.Demo.Seismic.Extent) (lo hi cols x : Nat) (s : Int × Int), (x, Option.some s) ∈ (Inkproof.Demo.Stack.present p lo hi cols).toList ↔ ∃ h, Inkproof.Demo.Stack.span (Inkproof.Demo.Stack.columns p lo hi cols)[x] = Option.some s
def Inkproof.Demo.Stack.outline : Nat → Nat → List ((Int × Int) × Nat) → String
def Inkproof.Demo.Stack.outlinePoints : Nat → Nat → List ((Int × Int) × Nat) → List (Nat × Int)
theorem Inkproof.Demo.Stack.outline_eq : ∀ (height top : Nat) (run : List ((Int × Int) × Nat)), Inkproof.Demo.Stack.outline height top run = " ".intercalate (List.map (fun x => match x with | (x, y) => ToString.toString x ++ ToString.toString "," ++ ToString.toString y) (Inkproof.Demo.Stack.outlinePoints height top run))
def Inkproof.Demo.Stack.pixelY : Nat → Nat → Int → Int
def Inkproof.Demo.Stack.present : Inkproof.Core.Pyramid Inkproof.Demo.Seismic.Extent → Nat → Nat → Nat → Array (Nat × Option (Int × Int))
def Inkproof.Demo.Stack.span : Inkproof.Demo.Seismic.Extent → Option (Int × Int)
theorem Inkproof.Demo.Stack.span_eq_some : ∀ (e : Inkproof.Demo.Seismic.Extent) (a b : Int), Inkproof.Demo.Stack.span e = Option.some (a, b) ↔ e.fst.get = Option.some a ∧ e.snd.get = Option.some b
