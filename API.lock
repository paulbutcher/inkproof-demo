theorem Inkproof.Demo.Stack.drawn_points_perm : ∀ (p : Inkproof.Core.Pyramid Inkproof.Demo.Seismic.Extent) (lo hi cols : Nat), (Inkproof.Demo.Stack.drawn p lo hi cols).series.points.toList.Perm (Inkproof.Demo.Stack.present p lo hi cols).toList
theorem Inkproof.Demo.Stack.getElem_columns : ∀ (p : Inkproof.Core.Pyramid Inkproof.Demo.Seismic.Extent) (lo hi cols c : Nat) (h : c < (Inkproof.Demo.Stack.columns p lo hi cols).size), (Inkproof.Demo.Stack.columns p lo hi cols)[c] = p.query (lo + (hi - lo) * c / cols) (lo + (hi - lo) * (c + 1) / cols)
theorem Inkproof.Demo.Stack.getElem_traces : ∀ (p : Inkproof.Core.Pyramid Inkproof.Demo.Seismic.Extent) (lo hi cols height top i : Nat) (h : i < (Inkproof.Demo.Stack.traces p lo hi cols height top).length), (Inkproof.Demo.Stack.traces p lo hi cols height top)[i] = Inkproof.Demo.Stack.outline height top (List.filterMap (fun x => match x with | (x, v) => Option.map (fun x_1 => (x_1, x)) v) (Inkproof.Demo.Stack.drawn p lo hi cols).segments.toList[i].points.toList)
theorem Inkproof.Demo.Stack.length_outlinePoints : ∀ (height top : Nat) (run : List ((Int × Int) × Nat)), (Inkproof.Demo.Stack.outlinePoints height top run).length = 2 * run.length
