theorem Inkproof.Demo.Place.put_getElem?_of_lt : ∀ (l : List Int) (a : Array (Option Int)) (i j : Nat), j < i ∨ i + l.length ≤ j → (Inkproof.Demo.Place.put a i l)[j]? = a[j]?
